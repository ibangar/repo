# Builds the Sculpt PWA and publishes it to GitHub Pages at https://<owner>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy Sculpt to GitHub Pages

on:
  push:
    branches: [main, master, claude/higgsfield-cli-integration-dg8vq1]
    paths: ['sculpt/**', '.github/workflows/deploy-sculpt.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sculpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sculpt/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build for Pages
        run: npx tsc -b && BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npx vite build && cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sculpt/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
